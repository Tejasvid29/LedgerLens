name: Deploy API to ECS

# Manual only, deliberately — this workflow will fail until the AWS side
# (ECR repo, ECS cluster/service, IAM roles, RDS, ElastiCache — see
# docs/deploy.md) actually exists and AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
# are set as repo secrets. Once that's done, flip `on:` to
# `push: { branches: [main], paths: ['apps/api/**', 'packages/shared/**'] }`
# for real continuous deployment.
on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1 # update to match the region used in docs/deploy.md
  ECR_REPOSITORY: ledgerlens-api
  ECS_CLUSTER: ledgerlens
  ECS_SERVICE: ledgerlens-api
  ECS_TASK_DEFINITION: infra/ecs/task-definition.json
  CONTAINER_NAME: api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f apps/api/Dockerfile -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Run migrations against the target database
        # A one-off run, not part of the container's own boot (see
        # apps/api/Dockerfile) — needs the same DATABASE_URL the task
        # definition's containers use, supplied here as its own secret
        # since this step runs on the GitHub Actions runner, not inside
        # the ECS network.
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - name: Render the new image into the task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
